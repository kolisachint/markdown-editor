name: build

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:

jobs:
  linux:
    name: linux
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          # Ubuntu's own Qt is 6.4, and QStyleHints::colorScheme() arrived in
          # 6.5, so build against an official Qt rather than the distro one.
          version: '6.8.3'
          cache: true

      - name: Test
        run: ./bin/test

      - name: Build
        run: ./bin/build

  macos:
    name: macos
    runs-on: macos-latest
    permissions:
      # Needed to create the release that the tagged run attaches the app to.
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Install Qt
        run: brew install qt

      - name: Test
        run: ./bin/test

      - name: Build app
        run: ./bin/build-macos

      - name: Package
        run: ditto -c -k --keepParent build/Omawrite.app Omawrite-macos.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Omawrite-macos
          path: Omawrite-macos.zip

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: Omawrite-macos.zip
