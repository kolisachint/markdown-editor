name: build

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:

jobs:
  linux:
    name: linux
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Qt
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            qt6-base-dev qt6-declarative-dev qt6-tools-dev \
            libgl1-mesa-dev

      - name: Test
        run: ./bin/test

      - name: Build
        run: ./bin/build

  macos:
    name: macos
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Qt
        run: brew install qt

      - name: Test
        run: ./bin/test

      - name: Build app
        run: ./bin/build-macos

      - name: Package
        run: ditto -c -k --keepParent build/Omawrite.app Omawrite-macos.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Omawrite-macos
          path: Omawrite-macos.zip

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: Omawrite-macos.zip
